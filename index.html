<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ParaPhrase — AI Paraphrasing Tool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0d0f14;
      --surface: #13161e;
      --surface-2: #1a1e28;
      --surface-3: #222736;
      --border: #2a2f3f;
      --border-light: #343a50;
      --accent: #6c8aff;
      --accent-glow: rgba(108, 138, 255, 0.18);
      --accent-2: #a78bfa;
      --text-primary: #e8ecf4;
      --text-secondary: #8891a9;
      --text-muted: #525a72;
      --success: #4ade80;
      --warning: #fb923c;
      --radius: 12px;
      --radius-sm: 8px;
      --radius-lg: 16px;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Sora', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ─── NOISE TEXTURE OVERLAY ─── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.6;
    }

    /* ─── AMBIENT GLOW ─── */
    body::after {
      content: '';
      position: fixed;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 800px;
      height: 400px;
      background: radial-gradient(ellipse, rgba(108, 138, 255, 0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ─── HEADER ─── */
    header {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      height: 62px;
      border-bottom: 1px solid var(--border);
      background: rgba(13, 15, 20, 0.8);
      backdrop-filter: blur(12px);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
    }

    .logo-text {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.4px;
      color: var(--text-primary);
    }

    .logo-text span {
      color: var(--accent);
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .nav a {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: var(--radius-sm);
      transition: all 0.15s;
    }

    .nav a:hover {
      color: var(--text-primary);
      background: var(--surface-2);
    }

    .nav a.active {
      color: var(--accent);
      background: var(--accent-glow);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-family: 'Sora', sans-serif;
      font-size: 13px;
      font-weight: 500;
      padding: 7px 16px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-ghost:hover {
      border-color: var(--border-light);
      color: var(--text-primary);
    }

    .btn-primary {
      background: var(--accent);
      border: none;
      color: #fff;
      font-family: 'Sora', sans-serif;
      font-size: 13px;
      font-weight: 600;
      padding: 7px 18px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 0 20px rgba(108, 138, 255, 0.3);
    }

    .btn-primary:hover {
      background: #7d9bff;
      box-shadow: 0 0 28px rgba(108, 138, 255, 0.45);
      transform: translateY(-1px);
    }

    /* ─── TOOL TABS ─── */
    .tool-tabs {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 0 32px;
      border-bottom: 1px solid var(--border);
      background: rgba(13, 15, 20, 0.6);
      backdrop-filter: blur(8px);
      overflow-x: auto;
    }

    .tool-tab {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 14px 18px;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.15s;
      white-space: nowrap;
      user-select: none;
    }

    .tool-tab:hover {
      color: var(--text-secondary);
    }

    .tool-tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .tool-tab-icon {
      font-size: 15px;
      opacity: 0.8;
    }

    .tool-tab-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 20px;
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      color: white;
      letter-spacing: 0.3px;
    }

    /* ─── MAIN CONTENT ─── */
    main {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 28px 32px;
      gap: 20px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    /* ─── MODE SELECTOR ─── */
    .modes-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .modes-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-right: 4px;
    }

    .mode-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-secondary);
      font-family: 'Sora', sans-serif;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      user-select: none;
    }

    .mode-btn:hover {
      border-color: var(--border-light);
      color: var(--text-primary);
      background: var(--surface-2);
    }

    .mode-btn.active {
      border-color: var(--accent);
      background: var(--accent-glow);
      color: var(--accent);
    }

    .mode-btn .mode-icon {
      font-size: 11px;
      opacity: 0.8;
    }

    .mode-btn.pro-locked {
      opacity: 0.55;
      position: relative;
    }

    .mode-btn.pro-locked::after {
      content: '✦';
      font-size: 9px;
      color: #f59e0b;
      margin-left: 2px;
    }

    /* ─── EDITOR AREA ─── */
    .editor-container {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      min-height: 440px;
      animation: fadeIn 0.4s ease both;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .editor-pane {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .editor-pane-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface-2);
    }

    .editor-pane-title {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .editor-pane-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      transition: all 0.15s;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn:hover {
      color: var(--text-secondary);
      background: var(--surface-3);
    }

    .editor-pane-body {
      flex: 1;
      position: relative;
    }

    textarea {
      width: 100%;
      height: 100%;
      min-height: 360px;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      font-family: 'Sora', sans-serif;
      font-size: 15px;
      line-height: 1.75;
      color: var(--text-primary);
      padding: 22px 24px;
      caret-color: var(--accent);
    }

    textarea::placeholder {
      color: var(--text-muted);
      font-weight: 300;
    }

    .output-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      pointer-events: auto;
    }

    .output-placeholder-icon {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--surface-3);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      opacity: 0.5;
    }

    .output-placeholder-text {
      font-size: 13.5px;
      color: var(--text-muted);
      font-weight: 400;
      text-align: center;
      line-height: 1.6;
      max-width: 220px;
    }

    .editor-pane-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      border-top: 1px solid var(--border);
      background: var(--surface-2);
    }

    .word-count {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: var(--text-muted);
    }

    .pane-footer-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ─── CENTER DIVIDER ─── */
    .editor-divider {
      width: 1px;
      background: var(--border);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .paraphrase-trigger {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .paraphrase-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--accent);
      border: 3px solid var(--bg);
      color: white;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 0 24px rgba(108, 138, 255, 0.4);
    }

    .paraphrase-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 36px rgba(108, 138, 255, 0.6);
    }

    /* ─── BOTTOM TOOLBAR ─── */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 24px;
      animation: fadeIn 0.5s ease 0.1s both;
    }

    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .strength-control {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .strength-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .strength-slider-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 130px;
      height: 4px;
      border-radius: 2px;
      background: linear-gradient(to right, var(--accent) 0%, var(--accent) 50%, var(--surface-3) 50%);
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--bg);
      box-shadow: 0 0 8px rgba(108, 138, 255, 0.5);
      cursor: pointer;
      transition: transform 0.15s;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    .strength-value {
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      min-width: 100px;
      font-family: 'DM Mono', monospace;
    }

    .synonym-toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 500;
      cursor: pointer;
      user-select: none;
    }

    .toggle-switch {
      position: relative;
      width: 36px;
      height: 20px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      inset: 0;
      background: var(--surface-3);
      border-radius: 20px;
      border: 1px solid var(--border);
      transition: all 0.2s;
      cursor: pointer;
    }

    .toggle-slider::before {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--text-muted);
      top: 2px;
      left: 2px;
      transition: all 0.2s;
    }

    .toggle-switch input:checked + .toggle-slider {
      background: var(--accent-glow);
      border-color: var(--accent);
    }

    .toggle-switch input:checked + .toggle-slider::before {
      transform: translateX(16px);
      background: var(--accent);
    }

    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-paraphrase {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border: none;
      color: #fff;
      font-family: 'Sora', sans-serif;
      font-size: 14px;
      font-weight: 700;
      padding: 10px 28px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      letter-spacing: 0.2px;
      transition: all 0.2s;
      box-shadow: 0 4px 24px rgba(108, 138, 255, 0.35);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-paraphrase:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(108, 138, 255, 0.5);
    }

    .btn-paraphrase:active {
      transform: translateY(0);
    }

    .shortcut-hint {
      font-size: 11px;
      color: var(--text-muted);
      font-family: 'DM Mono', monospace;
      padding: 3px 8px;
      border: 1px solid var(--border);
      border-radius: 5px;
    }

    /* FILES TAB --- */
    .files-tab-container{
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap:0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      min-height: 68px;
    }

    /* ─── INFO BAR ─── */
    .info-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 32px;
      padding: 12px 0 4px;
      animation: fadeIn 0.5s ease 0.2s both;
    }

    .info-stat {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12.5px;
      color: var(--text-muted);
    }

    .info-stat-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 6px var(--success);
    }

    .info-stat-dot.yellow {
      background: #fbbf24;
      box-shadow: 0 0 6px #fbbf24;
    }

    .info-stat-dot.blue {
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
    }

    

    /* ─── SCROLLBAR ─── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--border-light); }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 768px) {
      header { padding: 0 16px; }
      .nav { display: none; }
      main { padding: 16px; gap: 14px; }
      .editor-container {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto auto;
      }
      .editor-divider {
        width: auto;
        height: 1px;
        flex-direction: row;
      }
      .paraphrase-btn {
        position: relative;
        transform: rotate(90deg);
      }
      .toolbar { flex-direction: column; gap: 14px; align-items: flex-start; }
    }
  </style>
</head>
<body>

  <!-- ─── HEADER ─── -->
  <header>
    <a class="logo" href="#">
      <div class="logo-icon">✦</div>
      <span class="logo-text">Ref<span>AI</span>n</span>
    </a>

    <nav class="nav">
      <a href="#" class="active">Paraphraser</a>
    </nav>

  </header>

  <!-- ─── TOOL TABS ─── -->
  <div class="tool-tabs">
    <div class="tool-tab active">
      <span class="tool-tab-icon">⟳</span>
      Paraphraser
    </div>
  </div>

  <!-- ─── MAIN ─── -->
  <main>

    <!-- Mode Selector -->
    <div class="modes-bar">
      <span class="modes-label">Mode</span>

      <button class="mode-btn active" data-mode="standard">
        <span class="mode-icon">✦</span> Standard
      </button>
      <button class="mode-btn" data-mode="fluency">
        <span class="mode-icon">◈</span> Fluency
      </button>
      <button class="mode-btn" data-mode="formal">
        <span class="mode-icon">◆</span> Formal
      </button>
      <button class="mode-btn" data-mode="academic">
        <span class="mode-icon">◉</span> Academic
      </button>
      <button class="mode-btn" data-mode="simple">
        <span class="mode-icon">○</span> Simple
      </button>
      <button class="mode-btn pro-locked" data-mode="creative">
        <span class="mode-icon">✳</span> Creative
      </button>
      <button class="mode-btn pro-locked" data-mode="expand">
        <span class="mode-icon">⊕</span> Expand
      </button>
      <button class="mode-btn pro-locked" data-mode="shorten">
        <span class="mode-icon">⊖</span> Shorten
      </button>
    </div>

    <!-- Editor -->
    <div class="editor-container">

      <!-- Input Pane -->
      <div class="editor-pane">
        <div class="editor-pane-header">
          <span class="editor-pane-title">Input</span>
          <div class="editor-pane-actions">
            <button class="icon-btn" id="clear-btn" title="Clear">
              <i data-lucide="file-x"></i>
            </button>
            <input type="file" id="file-upload" accept=".csv,.xlsx" style="display:none;" />
            <button class="icon-btn" title="Upload file">
              <i data-lucide="arrow-up-from-line"></i>
            </button>
            <button class="icon-btn" title="Paste from clipboard">
              <i data-lucide="file"></i>
            </button>
          </div>
        </div>
        <div class="editor-pane-body">
          <textarea
            id="input-area"
            placeholder="Enter or paste your text here to paraphrase it..."
            spellcheck="false"
          ></textarea>
        </div>
        <div class="editor-pane-footer">
          <span class="word-count" id="word-count">0 / 1,000</span>
          <div class="pane-footer-actions">
            <button class="icon-btn" title="Undo">↩</button>
            <button class="icon-btn" title="Redo">↪</button>
          </div>
        </div>
      </div>

      <!-- Center Divider -->
      <div class="editor-divider">
        <div class="paraphrase-trigger">
          <button class="paraphrase-btn" title="Paraphrase">⟳</button>
        </div>
      </div>

      <!-- Output Pane -->
      <div class="editor-pane">
        <div class="editor-pane-header">
          <span class="editor-pane-title">Output</span>
          <div class="editor-pane-actions">
            <button class="icon-btn" title="Copy output">
              <i data-lucide="clipboard"></i>
            </button>
            <button class="icon-btn" title="Download">
              <i data-lucide="file-down"></i>
            </button>
            <button class="icon-btn" title="Synonym highlighter">
              ✦
            </button>
          </div>
        </div>
        <div class="editor-pane-body">
          <div class="output-placeholder">
            <div class="output-placeholder-icon">✦</div>
            <p class="output-placeholder-text">
              Your paraphrased text will appear here
            </p>
          </div>
        </div>
        <div class="editor-pane-footer">
          <span class="word-count">— / —</span>
          <div class="pane-footer-actions">
            <button class="icon-btn" title="Compare changes">⊡</button>
            <button class="icon-btn" title="Send to input">↩</button>
          </div>
        </div>
      </div>

    </div>

    <!-- Files Tab-->
    <div class="files-tab-container">

    </div>

    <!-- Bottom Toolbar -->
    <div class="toolbar">
      <div class="toolbar-left">

  <script>
    document.addEventListener('DOMContentLoaded', function () {

      // Mode buttons
      document.querySelectorAll('.mode-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          document.querySelectorAll('.mode-btn').forEach(function (b) {
            b.classList.remove('active');
          });
          btn.classList.add('active');
        });
      });

      // Word count
      var inputEl = document.getElementById('input-area');
      var countEl = document.getElementById('word-count');
      if (inputEl && countEl) {
        inputEl.addEventListener('input', function () {
          var text = inputEl.value.trim();
          var count = text ? text.split(/\s+/).length : 0;
          countEl.textContent = count + ' / 1,000';
        });
      }

      // Clear button
      var clearBtn = document.getElementById('clear-btn');
      if (clearBtn && inputEl) {
        clearBtn.addEventListener('click', function () {
          inputEl.value = '';
          if (countEl) countEl.textContent = '0 / 1,000';
        });
      }

      // Strength slider
      var slider = document.getElementById('strength-slider');
      var strengthLabel = document.getElementById('strength-value');
      if (slider && strengthLabel) {
        var labels = ['Fewer Changes', 'Balanced', 'More Changes'];
        slider.addEventListener('input', function () {
          strengthLabel.textContent = labels[parseInt(slider.value)];
        });
      }

    });

    // Create lucide icons
    lucide.createIcons();
  </script>
  <script>
const API_URL = "https://refain-ai-dataset-cleaner.onrender.com/analyze/";
  let lastCleanedCsv = '';

  function downloadCsv(csvText, filename) {
    if (!csvText) return;
    const blob = new Blob([csvText], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename || 'cleaned.csv';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  const downloadBtn = document.querySelector('button[title="Download"]');
  if (downloadBtn) {
    downloadBtn.addEventListener('click', () => {
      if (!lastCleanedCsv) {
        alert('No cleaned dataset available yet. Analyze text or upload a file first.');
        return;
      }
      downloadCsv(lastCleanedCsv, 'cleaned.csv');
    });
  }

  const copyBtn = document.querySelector('button[title="Copy output"]');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      if (!lastCleanedCsv) {
        alert('No cleaned text available yet. Analyze text or upload a file first.');
        return;
      }
      try {
        await navigator.clipboard.writeText(lastCleanedCsv);
      } catch (err) {
        console.error('Copy failed:', err);
        alert('Unable to copy text from browser clipboard.');
      }
    });
  }

document.querySelector(".btn-paraphrase").addEventListener("click", async () => {
  const fileInput = document.querySelector("input[type='file']");
    const inputArea = document.getElementById("input-area");
    const text = inputArea ? inputArea.value : '';

  const formData = new FormData();

  if (fileInput && fileInput.files.length > 0) {
    formData.append("file", fileInput.files[0]);
  } else {
    formData.append("text", text);
  }

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      body: formData
    });

    const data = await response.json();
    console.log("Backend result:", data);

    const out = document.querySelector('.output-placeholder');
    if (!out) return;
    out.innerHTML = '';
    out.style.pointerEvents = 'auto';

    const cleanedText = data && (data.fixed_text || data.cleaned_csv)
      ? String(data.fixed_text || data.cleaned_csv)
      : '';

    if (cleanedText) {
      lastCleanedCsv = cleanedText;
    }

    const pre = document.createElement('pre');
    pre.style.color = '#e8ecf4';
    pre.style.padding = '20px';
    pre.style.margin = '0';
    pre.style.whiteSpace = 'pre-wrap';
    pre.style.wordBreak = 'break-word';
    pre.textContent = cleanedText || JSON.stringify(data, null, 2);
    out.appendChild(pre);

    if (cleanedText) {
      const actionWrap = document.createElement('div');
      actionWrap.style.display = 'flex';
      actionWrap.style.gap = '8px';
      actionWrap.style.padding = '10px 20px';

      const copyAction = document.createElement('button');
      copyAction.className = 'btn-paraphrase';
      copyAction.textContent = 'Copy cleaned text';
      copyAction.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(cleanedText);
        } catch (err) {
          console.error('Copy failed:', err);
          alert('Unable to copy text from browser clipboard.');
        }
      });

      const dl = document.createElement('button');
      dl.className = 'btn-paraphrase';
      dl.textContent = 'Download cleaned CSV';
      dl.addEventListener('click', () => {
        downloadCsv(cleanedText, 'cleaned.csv');
      });

      actionWrap.appendChild(copyAction);
      actionWrap.appendChild(dl);
      out.appendChild(actionWrap);
    }

  } catch (err) {
    console.error("Error:", err);
    document.querySelector(".output-placeholder").innerHTML =
      "<p style='color:red;'>Backend error. Check console.</p>";
  }
});
</script>
  <script type="module" src="/src/main.ts"></script>
